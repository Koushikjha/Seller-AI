spring:
  datasource:
    # H2 in MySQL compatibility mode. Hibernate still detects H2Dialect from
    # JDBC metadata, so this is parity of SQL syntax, not of behaviour — if a
    # bug is dialect-specific, only a real MySQL will show it. Swap in
    # Testcontainers (org.testcontainers:mysql) when that starts mattering.
    url: jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Schema comes from the entities here, not from V1__schema.sql, so the
      # migration's MySQL-only syntax (BINARY(16), ENGINE=InnoDB) never runs
      # in tests. That is also why the migration needs its own check against
      # a real MySQL — see README.
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

marketplace:
  seed:
    enabled: true
  discount:
    base-pct: 2
    per-round-bonus-pct: 2
    max-rounds-counted: 3
    offer-ttl-minutes: 30
    repeat-buyer-cap-pct: 1
    repeat-look-back-days: 30
  identity:
    # Raised for the suite: MockMvc reports every request from 127.0.0.1, so the
    # whole test class shares one bucket and unrelated tests start failing on a
    # policy they are not testing. The limiter itself is covered properly in
    # IdentityRateLimitTest, which overrides this and supplies its own IP.
    max-verifications-per-ip-per-hour: 100
  webinfo:
    cache-ttl-days: 7
    provider: stub

  razorpay:
    # Pinned empty ON PURPOSE, and not left to ${RAZORPAY_KEY_ID:}.
    #
    # application.yml reads those keys from the environment, so a developer who
    # exported real test keys to run the app would have `mvn test` build a live
    # RazorpayPaymentGateway and call api.razorpay.com from a unit test. That
    # fails as a 409 that looks like a business-rule bug and is actually the
    # shell leaking into the suite. Blank here means the stub gateway, always,
    # on every machine.
    key-id: ""
    key-secret: ""
    # A known secret so the webhook signature tests can sign a payload. Never
    # blank, or the controller correctly rejects everything and the tests that
    # matter never reach the signature check.
    webhook-secret: "test_webhook_secret"
  agent:
    provider: scripted
    max-tool-iterations: 6

logging:
  level:
    com.marketplace: INFO